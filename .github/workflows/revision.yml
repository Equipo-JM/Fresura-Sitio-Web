# Revisión de cada pull request hacia main (AGENTS.md, «Antes del pull request»; DT-01, D11).
# Mismas comprobaciones que se ejecutan en local: Biome, tipos y pruebas.
name: Revisión

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formato y revisión (Biome)
        run: npx biome ci .
      - name: Tipos y compilación
        run: npm run build
      - name: Pruebas
        run: npm test
